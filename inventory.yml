---
# The server this copy manages. Where it is, and the private key Ansible
# connects with, are not written out here: they come from the encrypted vault,
# so a published copy does not say where to knock.
#
# Nothing here is yours to fill in: the address, the port, the private key and
# the login name come from the encrypted vault.
#
# ansible_port is the port Ansible connects on now - 22 on a fresh server,
# and the new port after the first run has moved sshd.
# ansible_user: the account Ansible logs in as. On a fresh server it is root,
#   because the real account does not exist yet; after the first run it is that
#   account. Both come from vault_ssh_login_user.
all:
  hosts:
    server:
      ansible_host: "{{ vault_server_host }}"
      ansible_port: "{{ vault_ssh_default_port }}"
      ansible_user: "{{ vault_ssh_login_user }}"
      ansible_ssh_private_key_file: "{{ vault_private_key_file }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
