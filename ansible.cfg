[defaults]
inventory = inventory.yml
retry_files_enabled = False

# A freshly built server has no key in known_hosts yet, so the first run would
# stop and ask. Turn this on once you have added the server key by hand.
host_key_checking = False
display_skipped_hosts = False
interpreter_python = auto_silent
force_handlers = True

# ssh-config.yml changes the SSH port mid-run, and the plays after it reuse the
# open connection instead of dialing again.
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey
