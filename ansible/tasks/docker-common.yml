---
# A task list, not a playbook. Both docker playbooks include it.

- name: Wait for the apt lock to be released
  ansible.builtin.shell: |
    timeout 300 bash -c '
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 ||
          fuser /var/lib/dpkg/lock >/dev/null 2>&1 ||
          fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
      echo "Waiting for apt lock..."
      sleep 10
    done'
  changed_when: false

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create the keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Dearmor by hand instead of using the deb822_repository module: that one needs
# python3-debian on the target, which a fresh server does not have.
- name: Add the Docker GPG key
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Detect the package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: deb_arch
  changed_when: false

- name: Detect the distribution codename
  ansible.builtin.shell: . /etc/os-release && echo "$VERSION_CODENAME"
  register: distro_codename
  changed_when: false

- name: Add the Docker apt repository
  ansible.builtin.copy:
    content: >-
      deb [arch={{ deb_arch.stdout }} signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu {{ distro_codename.stdout }} stable
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"

# Rootless uses the same packages: rootlesskit starts the very same dockerd
# binary, just inside a user namespace.
- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Provide the docker-compose command name
  ansible.builtin.file:
    src: /usr/libexec/docker/cli-plugins/docker-compose
    dest: /usr/local/bin/docker-compose
    state: link
